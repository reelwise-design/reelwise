<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reelwise — Know the Movie. Know the Story.</title><style>
:root{--bg:#090b0f;--panel:#11151c;--line:#252c38;--text:#f5f7fa;--muted:#9ca6b5;--accent:#ff5a36;--gold:#e4b34d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.wrap{max-width:1120px;margin:auto;padding:0 20px}header{position:sticky;top:0;z-index:5;background:rgba(9,11,15,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.nav{height:68px;display:flex;align-items:center;gap:28px}.logo{font-size:25px;font-weight:900;letter-spacing:-1px;cursor:pointer}.logo span{color:var(--accent)}nav{display:flex;gap:20px;color:#cbd1da}nav button{background:none;border:0;color:inherit;padding:8px}.searchbox{margin-left:auto;display:flex;gap:8px}.searchbox input{width:250px;background:#151a22;border:1px solid #303846;color:white;border-radius:9px;padding:10px 12px;outline:none}.searchbox input:focus{border-color:var(--accent)}.searchbox button,.cta{background:var(--accent);border:0;color:white;border-radius:9px;padding:10px 15px;font-weight:800}.page{padding:48px 0 70px}.hero{padding:60px 0 45px;display:grid;grid-template-columns:1.4fr .8fr;gap:35px;align-items:center}.eyebrow{color:var(--gold);font-weight:900;letter-spacing:1.5px;font-size:12px}.hero h1{font-size:clamp(44px,7vw,76px);line-height:.98;letter-spacing:-3px;margin:12px 0 18px}.hero p{font-size:19px;color:var(--muted);max-width:650px}.heroCard{background:linear-gradient(145deg,#1d2634,#0f1319);border:1px solid var(--line);border-radius:18px;padding:28px;min-height:280px;display:flex;flex-direction:column;justify-content:end}.heroCard b{font-size:28px}.section{padding:28px 0}.sectionhead{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.section h2{margin:0;font-size:28px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:.18s}.card:hover{transform:translateY(-3px);border-color:#4a5568}.poster{aspect-ratio:2/3;background:linear-gradient(145deg,#36465b,#141820);display:flex;align-items:end;padding:15px;font-size:20px;font-weight:900}.info{padding:13px}.info b{display:block}.info small{color:var(--muted)}.feature{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:24px;margin:12px 0}.feature h3{font-size:24px;margin:6px 0}.feature p{color:var(--muted);max-width:780px}.tag{display:inline-block;border:1px solid #384150;border-radius:999px;padding:6px 10px;margin:4px;color:#cbd1da}.detail{display:grid;grid-template-columns:280px 1fr;gap:30px}.detailposter{aspect-ratio:2/3;border-radius:15px;background:linear-gradient(145deg,#39495f,#10141a);display:flex;align-items:end;padding:25px;font-size:30px;font-weight:900}.detail h1{font-size:clamp(40px,6vw,62px);line-height:1;margin:0 0 8px}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.fact{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px}.fact b{display:block;font-size:18px}.fact small{color:var(--muted)}.cast{display:flex;flex-wrap:wrap;gap:8px}.cast button{background:#151b24;color:white;border:1px solid #303846;border-radius:8px;padding:9px}.resultList{display:grid;gap:10px;margin-top:20px}.result{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;justify-content:space-between;cursor:pointer}.empty{padding:40px;text-align:center;background:var(--panel);border:1px dashed #37404e;border-radius:14px}.back{background:none;border:0;color:var(--muted);padding:0 0 20px}.quiz button{margin:5px;padding:10px 14px;background:#171d26;border:1px solid #303846;color:white;border-radius:8px}.answer{color:var(--gold);font-weight:800}.footer{border-top:1px solid var(--line);color:#737d8b;padding:28px 0;font-size:12px}@media(max-width:850px){nav{display:none}.hero,.detail{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.searchbox{width:100%}.searchbox input{width:100%}.nav{gap:10px}.searchbox button{display:block}.facts{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.hero{padding-top:35px}.hero h1{letter-spacing:-2px}.searchbox input{width:145px}.logo{font-size:21px}}
</style></head><body><header><div class="wrap nav"><div class="logo" id="logo">reel<span>wise</span></div><nav><button data-page="home">Movies</button><button data-page="discover">Discover</button><button data-page="stars">Stars</button><button data-page="stories">Stories</button></nav><form class="searchbox" id="searchForm"><input id="searchInput" autocomplete="off" placeholder="Search movies or stars…"><button type="submit">Search</button></form></div></header><main id="app"></main><footer class="footer"><div class="wrap">Reelwise · Know the movie. Know the story.</div></footer><script>
const movies=[
{id:'rocky3',title:'Rocky III',year:1982,genre:'Drama · Sports',icon:'🥊',cast:['Sylvester Stallone','Carl Weathers','Mr. T','Hulk Hogan','Talia Shire'],story:'During the Thunderlips sequence, Hulk Hogan hit Stallone hard enough that Stallone feared he had broken his collarbone.'},
{id:'topgun',title:'Top Gun',year:1986,genre:'Action · Drama',icon:'✈️',cast:['Tom Cruise','Val Kilmer','Kelly McGillis','Anthony Edwards','Meg Ryan'],story:'Tom Cruise specifically wanted Val Kilmer to play Iceman.'},
{id:'afgm',title:'A Few Good Men',year:1992,genre:'Drama · Legal',icon:'⚖️',cast:['Tom Cruise','Jack Nicholson','Demi Moore'],story:'One of the most quoted courtroom movies of its era.'},
{id:'sandlot',title:'The Sandlot',year:1993,genre:'Comedy · Family',icon:'⚾',cast:['Tom Guiry','Mike Vitar','James Earl Jones'],story:'A movie that became a cult favorite long after its original theatrical run.'},
{id:'goodfellas',title:'Goodfellas',year:1990,genre:'Crime · Drama',icon:'🍝',cast:['Robert De Niro','Ray Liotta','Joe Pesci'],story:'Its real-life inspirations and production stories are packed with Reelwise material.'},
{id:'hangover',title:'The Hangover',year:2009,genre:'Comedy',icon:'🍻',cast:['Bradley Cooper','Ed Helms','Zach Galifianakis'],story:'The chemistry among its three leads became the heart of the franchise.'},
{id:'oldschool',title:'Old School',year:2003,genre:'Comedy',icon:'🎓',cast:['Will Ferrell','Luke Wilson','Vince Vaughn'],story:'A comedy that helped define the early-2000s comedy era.'},
{id:'forrest',title:'Forrest Gump',year:1994,genre:'Drama · Comedy',icon:'🪶',cast:['Tom Hanks','Robin Wright','Gary Sinise'],story:'A huge hit whose cast careers offer plenty of surprising connections.'},
{id:'sixth',title:'The Sixth Sense',year:1999,genre:'Mystery · Drama',icon:'👻',cast:['Bruce Willis','Haley Joel Osment','Toni Collette'],story:'A movie that became a cultural phenomenon and launched a young star.'},
{id:'godfather',title:'The Godfather',year:1972,genre:'Crime · Drama',icon:'🍊',cast:['Marlon Brando','Al Pacino','James Caan'],story:'The casting and studio battles behind this classic are movie-history gold.'}
];
const people={
'Tom Cruise':['Top Gun','A Few Good Men','The Firm','Jerry Maguire','Minority Report'],
'Val Kilmer':['Top Gun','Tombstone','Heat','The Doors'],
'Sylvester Stallone':['Rocky','Rocky II','Rocky III','Rocky IV','Cobra'],
'Carl Weathers':['Rocky','Rocky II','Rocky III','Predator'],
'Mr. T':['Rocky III','Rocky IV','A-Team'],
'Hulk Hogan':['Rocky III','No Holds Barred'],
'Meg Ryan':['Top Gun','When Harry Met Sally...','Sleepless in Seattle'],
'Bradley Cooper':['The Hangover','American Sniper','Silver Linings Playbook'],
'Will Ferrell':['Old School','Elf','Anchorman']};
const app=document.getElementById('app');
function movieCard(m){return `<article class="card" data-movie="${m.id}"><div class="poster"><span>${m.icon}<br>${m.title}</span></div><div class="info"><b>${m.title}</b><small>${m.year} · ${m.genre}</small></div></article>`}
function home(){app.innerHTML=`<div class="wrap"><section class="hero"><div><div class="eyebrow">MOVIES, CELEBRITIES & THE STORIES BEHIND THEM</div><h1>Know the movie.<br><span style="color:var(--accent)">Know the story.</span></h1><p>Reelwise is the movie experience for people who love the stuff that makes movies interesting — casting stories, celebrity connections, behind-the-scenes moments, bloopers, quotes and surprising facts.</p><button class="cta" id="discoverBtn">What should I watch?</button></div><div class="heroCard"><div class="eyebrow">🔥 YOU PROBABLY DIDN'T KNOW</div><b>Tom Cruise specifically wanted Val Kilmer as Iceman.</b><p class="muted">That's Reelwise: the story behind the movie, not just the movie itself.</p></div></section><section class="section"><div class="sectionhead"><div><h2>Popular on Reelwise</h2><div class="muted">Start with the movies people love to talk about.</div></div></div><div class="grid">${movies.slice(0,5).map(movieCard).join('')}</div></section><section class="section"><div class="feature"><div class="eyebrow">THE REELWISE DIFFERENCE</div><h3>IMDb tells you about the movie. Reelwise tells you why the movie is interesting.</h3><p>Every movie becomes a doorway into stories about its stars, unexpected connections, memorable quotes, production surprises and what to watch next.</p></div></section><section class="section"><div class="sectionhead"><div><h2>More movies</h2></div></div><div class="grid">${movies.slice(5).map(movieCard).join('')}</div></section></div>`;document.getElementById('discoverBtn').onclick=discover}
function movie(id){const m=movies.find(x=>x.id===id);if(!m)return;app.innerHTML=`<div class="wrap page"><button class="back" id="back">← Back</button><div class="detail"><div class="detailposter">${m.icon}<br>${m.title}</div><div><div class="eyebrow">${m.year} · ${m.genre.toUpperCase()}</div><h1>${m.title}</h1><p class="muted">This is the Reelwise layer: the stories, people and connections that make this movie worth revisiting.</p><div class="facts"><div class="fact"><b>${m.year}</b><small>Release year</small></div><div class="fact"><b>★ Reelwise</b><small>Featured title</small></div><div class="fact"><b>${m.cast.length}</b><small>Featured stars</small></div></div><section class="feature"><div class="eyebrow">🔥 YOU PROBABLY DIDN'T KNOW</div><h3>${m.story}</h3><p>Reelwise will eventually attach verified sources, interviews, clips and deeper stories here.</p></section><h2>The Stars</h2><div class="cast">${m.cast.map(n=>`<button data-person="${encodeURIComponent(n)}">${n}</button>`).join('')}</div></div></div></div>`;document.getElementById('back').onclick=home}
function discover(){app.innerHTML=`<div class="wrap page"><button class="back" id="back">← Home</button><div class="eyebrow">DISCOVER</div><h1>What should you watch?</h1><p class="muted">Pick a movie and Reelwise will connect it to stars, stories and your next discovery.</p><div class="grid">${movies.map(movieCard).join('')}</div></div>`;document.getElementById('back').onclick=home}
function stars(){app.innerHTML=`<div class="wrap page"><button class="back" id="back">← Home</button><div class="eyebrow">THE STARS</div><h1>Follow the stars.</h1><p class="muted">A movie can lead you to a career, a connection or a story you never knew.</p><div class="grid">${Object.keys(people).map(n=>`<article class="card" data-person="${encodeURIComponent(n)}"><div class="poster">⭐<br>${n}</div><div class="info"><b>${n}</b><small>${people[n].length} connected titles</small></div></article>`).join('')}</div></div>`;document.getElementById('back').onclick=home}
function person(name){const filmography=people[name]||[];app.innerHTML=`<div class="wrap page"><button class="back" id="back">← Stars</button><div class="eyebrow">REELWISE STAR</div><h1>${name}</h1><p class="muted">Explore the movies, connections and stories associated with ${name}.</p><section class="feature"><div class="eyebrow">WHY REELWISE?</div><h3>One star can unlock an entire movie rabbit hole.</h3><p>In the full product, this page will combine licensed filmography data with original Reelwise stories and links for deeper research.</p></section><h2>Connected Movies</h2><div class="grid">${filmography.map(title=>{const m=movies.find(x=>x.title.toLowerCase()===title.toLowerCase());return m?movieCard(m):`<article class="card"><div class="poster">🎬<br>${title}</div><div class="info"><b>${title}</b><small>Coming to the full database</small></div></article>`}).join('')}</div></div>`;document.getElementById('back').onclick=stars}
function stories(){app.innerHTML=`<div class="wrap page"><button class="back" id="back">← Home</button><div class="eyebrow">🔥 YOU PROBABLY DIDN'T KNOW</div><h1>Movie stories worth knowing.</h1><div class="feature"><h3>Top Gun — Tom Cruise wanted Val Kilmer as Iceman.</h3><p>A casting detail that changes how you look at the rivalry on screen.</p></div><div class="feature"><h3>Rocky III — the Thunderlips fight was rougher than it looked.</h3><p>Hulk Hogan's story about filming the sequence is exactly the kind of behind-the-scenes material Reelwise is built around.</p></div><div class="feature"><h3>Movie knowledge should lead somewhere.</h3><p>Click a star. Follow the career. Discover another movie. That's the Reelwise loop.</p></div></div>`;document.getElementById('back').onclick=home}
function search(q){q=q.trim().toLowerCase();if(!q){home();return}const ms=movies.filter(m=>(m.title+' '+m.genre+' '+m.cast.join(' ')).toLowerCase().includes(q));const ps=Object.keys(people).filter(n=>n.toLowerCase().includes(q));app.innerHTML=`<div class="wrap page"><button class="back" id="back">← Home</button><div class="eyebrow">SEARCH RESULTS</div><h1>Results for “${q.replaceAll('&','&amp;').replaceAll('<','&lt;')}”</h1>${ms.length?`<h2>Movies</h2><div class="grid">${ms.map(movieCard).join('')}</div>`:''}${ps.length?`<h2 style="margin-top:35px">Stars</h2><div class="resultList">${ps.map(n=>`<div class="result" data-person="${encodeURIComponent(n)}"><b>${n}</b><span class="muted">View star page →</span></div>`).join('')}</div>`:''}${!ms.length&&!ps.length?`<div class="empty"><h2>No match yet</h2><p class="muted">Try Rocky III, Top Gun, Tom Cruise, Val Kilmer or Stallone.</p></div>`:''}</div>`;document.getElementById('back').onclick=home}
document.addEventListener('click',e=>{const movieEl=e.target.closest('[data-movie]');if(movieEl){movie(movieEl.dataset.movie);return}const personEl=e.target.closest('[data-person]');if(personEl){person(decodeURIComponent(personEl.dataset.person));return}const page=e.target.closest('[data-page]');if(page){({home,discover,stars,stories}[page.dataset.page]||home)();return}if(e.target.closest('#logo'))home()});document.getElementById('searchForm').addEventListener('submit',e=>{e.preventDefault();search(document.getElementById('searchInput').value)});home();
</script></body></html>
