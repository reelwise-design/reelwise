<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reelwise — Know the Movie. Know the Story.</title>

<style>
:root{
  --bg:#090b0f;
  --panel:#11151c;
  --line:#252c38;
  --text:#f5f7fa;
  --muted:#9ca6b5;
  --accent:#ff5a36;
  --gold:#e4b34d
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

button,input{font:inherit}
button{cursor:pointer}

.wrap{
  max-width:1120px;
  margin:auto;
  padding:0 20px
}

header{
  position:sticky;
  top:0;
  z-index:5;
  background:rgba(9,11,15,.95);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line)
}

.nav{
  min-height:68px;
  display:flex;
  align-items:center;
  gap:24px;
  flex-wrap:wrap;
  padding-top:10px;
  padding-bottom:10px
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:-1px;
  cursor:pointer
}

.logo span{color:var(--accent)}

nav{
  display:flex;
  gap:8px;
  color:#cbd1da
}

nav button{
  background:none;
  border:0;
  color:inherit;
  padding:8px 10px
}

.searchbox{
  margin-left:auto;
  display:flex;
  gap:8px
}

.searchbox input{
  width:250px;
  background:#151a22;
  border:1px solid #303846;
  color:white;
  border-radius:9px;
  padding:10px 12px;
  outline:none
}

.searchbox input:focus{border-color:var(--accent)}

.searchbox button,
.cta{
  background:var(--accent);
  border:0;
  color:white;
  border-radius:9px;
  padding:10px 15px;
  font-weight:800
}

.page{padding:48px 0 70px}

.hero{
  padding:60px 0 45px;
  display:grid;
  grid-template-columns:1.4fr .8fr;
  gap:35px;
  align-items:center
}

.eyebrow{
  color:var(--gold);
  font-weight:900;
  letter-spacing:1.5px;
  font-size:12px
}

.hero h1{
  font-size:clamp(44px,7vw,76px);
  line-height:.98;
  letter-spacing:-3px;
  margin:12px 0 18px
}

.hero p{
  font-size:19px;
  color:var(--muted);
  max-width:650px
}

.heroCard{
  background:linear-gradient(145deg,#1d2634,#0f1319);
  border:1px solid var(--line);
  border-radius:18px;
  padding:28px;
  min-height:280px;
  display:flex;
  flex-direction:column;
  justify-content:end
}

.heroCard b{font-size:28px}

.section{padding:28px 0}

.sectionhead{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-bottom:18px
}

.section h2{
  margin:0;
  font-size:28px
}

.muted{color:var(--muted)}

.grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:14px
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  transition:.18s
}

.card:hover{
  transform:translateY(-3px);
  border-color:#4a5568
}

.poster{
  aspect-ratio:2/3;
  background:linear-gradient(145deg,#36465b,#141820);
  display:flex;
  align-items:end;
  padding:15px;
  font-size:20px;
  font-weight:900
}

.info{padding:13px}
.info b{display:block}
.info small{color:var(--muted)}

.feature{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:15px;
  padding:24px;
  margin:12px 0
}

.feature h3{
  font-size:24px;
  margin:6px 0
}

.feature p{
  color:var(--muted);
  max-width:780px
}

.detail{
  display:grid;
  grid-template-columns:280px 1fr;
  gap:30px
}

.detailposter{
  aspect-ratio:2/3;
  border-radius:15px;
  background:linear-gradient(145deg,#39495f,#10141a);
  display:flex;
  align-items:end;
  padding:25px;
  font-size:30px;
  font-weight:900
}

.personHero{
  display:grid;
  grid-template-columns:280px 1fr;
  gap:30px;
  align-items:start
}

.personPhoto{
  aspect-ratio:2/3;
  border-radius:15px;
  background:linear-gradient(145deg,#39495f,#10141a);
  background-size:cover;
  background-position:center;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:48px;
  font-weight:900
}

.personIntro h1{
  font-size:clamp(40px,6vw,62px);
  line-height:1;
  margin:0 0 12px
}

.personIntro p{
  color:var(--muted);
  font-size:16px;
  max-width:760px
}

.personMeta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:10px 0 18px
}

.personMeta span{
  background:#151b24;
  border:1px solid #303846;
  border-radius:999px;
  padding:7px 10px;
  color:#cbd1da
}

.facts{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:20px 0
}

.fact{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:10px;
  padding:13px
}

.fact b{
  display:block;
  font-size:18px
}

.fact small{color:var(--muted)}

.cast{
  display:flex;
  flex-wrap:wrap;
  gap:8px
}

.cast button{
  background:#151b24;
  color:white;
  border:1px solid #303846;
  border-radius:8px;
  padding:9px
}

.resultList{
  display:grid;
  gap:10px;
  margin-top:20px
}

.result{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:10px;
  padding:14px;
  display:flex;
  justify-content:space-between;
  cursor:pointer
}

.empty{
  padding:40px;
  text-align:center;
  background:var(--panel);
  border:1px dashed #37404e;
  border-radius:14px
}

.back{
  background:none;
  border:0;
  color:var(--muted);
  padding:0 0 20px
}

.quote{
  font-size:22px;
  font-weight:800;
  padding:14px 0;
  border-bottom:1px solid var(--line)
}

.quote:last-child{border-bottom:0}

.footer{
  border-top:1px solid var(--line);
  color:#737d8b;
  padding:28px 0;
  font-size:12px
}

.degreeStep{
  border:1px solid var(--line);
  background:#151a22;
  border-radius:12px;
  padding:18px;
  margin:10px 0
}

.degreeActor{
  font-size:20px;
  font-weight:900
}

.degreeMovie{
  color:var(--gold);
  margin-top:6px
}

@media(max-width:850px){
  .hero,.detail,.personHero{
    grid-template-columns:1fr
  }

  .grid{
    grid-template-columns:repeat(2,1fr)
  }

  .searchbox{
    order:2;
    width:100%;
    margin-left:0
  }

  .searchbox input{
    width:100%
  }

  nav{
    order:3;
    width:100%;
    overflow-x:auto
  }

  .facts{
    grid-template-columns:1fr 1fr
  }
}

@media(max-width:480px){
  .grid{
    grid-template-columns:1fr 1fr
  }

  .hero{
    padding-top:35px
  }

  .hero h1{
    letter-spacing:-2px
  }

  .logo{
    font-size:21px
  }
}
</style>
</head>

const app=document.getElementById("app");

function escapeHtml(value){
return String(value||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function movieCard(m){
return `
<article class="card" data-movie="${escapeHtml(m.id)}">
<div class="poster">
<span>${m.icon}<br>${escapeHtml(m.title)}</span>
</div>
<div class="info">
<b>${escapeHtml(m.title)}</b>
<small>${m.year} · ${escapeHtml(m.genre)}</small>
</div>
</article>`;
}

function quoteSection(title){
const qs=quotes[title]||[];

if(!qs.length)return "";

return `
<section class="section">
<div class="sectionhead">
<div>
<h2>🎬 Memorable Quotes</h2>
<div class="muted">Lines fans still remember.</div>
</div>
</div>

<div class="feature">
${qs.map(q=>`
<div class="quote">“${escapeHtml(q)}”</div>
`).join("")}
</div>
</section>`;
}

async function personByName(name){

app.innerHTML=`
<div class="wrap page">
<div class="eyebrow">REELWISE STAR</div>
<h1>Loading ${escapeHtml(name)}…</h1>
<p class="muted">Finding this star in the movie universe.</p>
</div>`;

try{

const r=await fetch(
"/api/search?type=person&q="+encodeURIComponent(name)
);

const data=await r.json();

if(!r.ok)throw new Error(data.error||"Search failed.");

const results=data.results||[];

const exact=results.find(
p=>p.name&&p.name.toLowerCase()===name.toLowerCase()
);

const person=exact||results[0];

if(!person){
throw new Error("We couldn't find that star.");
}

await loadPerson(person.id);

}catch(err){

app.innerHTML=`
<div class="wrap page">
<button class="back" id="back">← Back</button>
<div class="empty">
<h2>We couldn't find that star.</h2>
<p>${escapeHtml(err.message)}</p>
</div>
</div>`;

document.getElementById("back").onclick=home;
}
}

async function loadPerson(id){

try{

const r=await fetch(
"/api/search?type=person-details&id="+encodeURIComponent(id)
);

const data=await r.json();

if(!r.ok)throw new Error(data.error||"Unable to load star.");

renderPerson(data);

}catch(err){

app.innerHTML=`
<div class="wrap page">
<button class="back" id="back">← Back</button>
<div class="empty">
<h2>Unable to load this star.</h2>
<p>${escapeHtml(err.message)}</p>
</div>
</div>`;

document.getElementById("back").onclick=home;
}
}

function renderPerson(data){

const credits=data.credits||{};
const cast=credits.cast||[];

const moviesList=cast
.filter(x=>x.media_type==="movie"||x.title)
.sort((a,b)=>
Number(b.popularity||0)-Number(a.popularity||0)
)
.slice(0,20);

const initials=(data.name||"?")
.split(" ")
.map(x=>x[0])
.join("")
.slice(0,2);

app.innerHTML=`
<div class="wrap page">

<button class="back" id="back">← Home</button>

<div class="personHero">

<div
class="personPhoto"
style="${data.profile_path?
`background-image:url(https://image.tmdb.org/t/p/w500${data.profile_path})`
:""}">

${data.profile_path?"":escapeHtml(initials)}

</div>

<div class="personIntro">

<div class="eyebrow">REELWISE STAR</div>

<h1>${escapeHtml(data.name)}</h1>

<div class="personMeta">

${data.birthday?
`<span>🎂 ${escapeHtml(data.birthday)}</span>`:""}

${data.place_of_birth?
`<span>📍 ${escapeHtml(data.place_of_birth)}</span>`:""}

</div>

<p>
${escapeHtml(
data.biography||
"Reelwise is building this star's story — movies, quotes, connections and more."
)}
</p>

</div>

</div>

<section class="section">

<div class="sectionhead">
<div>
<h2>🎬 Movie Credits</h2>
<div class="muted">
Movies featuring ${escapeHtml(data.name)}.
</div>
</div>
</div>

<div class="grid">

${moviesList.map(m=>`
<article
class="card tmdbMovie"
data-id="${m.id}">

<div class="poster">
<span>
🎬<br>
${escapeHtml(m.title||m.original_title||"Movie")}
</span>
</div>

<div class="info">
<b>${escapeHtml(m.title||m.original_title||"Movie")}</b>
<small>
${m.release_date?
escapeHtml(m.release_date.substring(0,4)):""}
${m.character?
" · "+escapeHtml(m.character):""}
</small>
</div>

</article>
`).join("")}

</div>

</section>

</div>`;

document.getElementById("back").onclick=home;
}

function renderTmdbMovie(data){

const credits=data.credits||{};
const cast=credits.cast||[];

function sixdegrees(){

app.innerHTML=`
<div class="wrap page">

<button class="back" id="back">← Home</button>

<div class="eyebrow">
🎯 THE SIX DEGREES GAME
</div>

<h1>Connect any two stars.</h1>

<p class="muted">
Enter two actors and Reelwise will search their real movie
credits for a connection in six films or fewer.
</p>

<section class="feature">

<h2>Find a connection</h2>

<div
class="searchbox"
style="max-width:100%;margin-top:18px">

<input
id="degreeA"
placeholder="Starting star, e.g. Tom Cruise">

<span style="padding:0 6px;align-self:center">
→
</span>

<input
id="degreeB"
placeholder="Target star, e.g. Robert De Niro">

<button
type="button"
id="degreeGo">
Connect
</button>

</div>

<p class="muted" style="margin-top:12px">
Reelwise searches real movie credits.
</p>

</section>

<section class="section">

<div id="degreeResult" class="feature">

<h3>Ready?</h3>

<p class="muted">
Enter two stars above and Reelwise will calculate
the shortest movie connection it can find.
</p>

</div>

</section>

</div>`;

document.getElementById("back").onclick=home;
document.getElementById("degreeGo").onclick=runDegrees;
}

async function runDegrees(){

const a=document.getElementById("degreeA").value.trim();
const b=document.getElementById("degreeB").value.trim();
const out=document.getElementById("degreeResult");

if(!a||!b){

out.innerHTML=`
<h3>Enter two stars</h3>
<p class="muted">
Give Reelwise a starting actor and a target actor.
</p>`;

return;
}

if(a.toLowerCase()===b.toLowerCase()){

out.innerHTML=`
<h3>Pick two different stars</h3>
<p class="muted">
The starting and target actors need to be different.
</p>`;

return;
}

out.innerHTML=`
<h3>Searching the movie universe…</h3>
<p class="muted">
Reelwise is calculating the shortest real movie connection.
This may take a little while.
</p>`;

try{

const r=await fetch(
"/api/search?type=degrees&from="+
encodeURIComponent(a)+
"&to="+
encodeURIComponent(b)
);

const data=await r.json();

if(!r.ok){
throw new Error(
data.error||"Unable to find a connection."
);
}

if(!data.path||data.path.length<2){

out.innerHTML=`
<h3>No connection found within six films.</h3>
<p class="muted">
Try another pair of actors.
</p>`;

return;
}

let html=`
<div class="eyebrow">
CONNECTION FOUND
</div>

<h3>
${escapeHtml(data.from.name)}
→
${escapeHtml(data.to.name)}
</h3>
`;

for(let i=1;i<data.path.length;i++){

const step=data.path[i];
const previous=data.path[i-1];
const movie=step.movie||previous.movie;

html+=`
<div class="degreeStep">

<div class="degreeActor">
${escapeHtml(previous.person.name)}
</div>

<div style="text-align:center;font-size:24px;margin:5px">
↓
</div>

<div class="degreeActor">
${escapeHtml(step.person.name)}
</div>

${movie?
`<div class="degreeMovie">
🎬 ${escapeHtml(movie.title)}
${movie.year?
" · "+escapeHtml(movie.year):""}
</div>`:""}

</div>`;
}

html+=`
<p class="muted" style="margin-top:18px">
<strong>${data.distance}</strong>
movie connection${data.distance===1?"":"s"}.
</p>`;

out.innerHTML=html;

}catch(err){

out.innerHTML=`
<h3>We couldn't find that connection.</h3>
<p class="muted">
${escapeHtml(err.message)}
</p>`;
}
}

async function search(){

const q=document.getElementById("searchInput").value.trim();

if(!q)return;

app.innerHTML=`
<div class="wrap page">
<div class="eyebrow">SEARCHING REELWISE</div>
<h1>Looking for "${escapeHtml(q)}"…</h1>
</div>`;

try{

const r=await fetch(
"/api/search?type=multi&q="+encodeURIComponent(q)
);

const data=await r.json();

if(!r.ok)throw new Error(data.error||"Search failed.");

const moviesFound=data.movies||[];
const peopleFound=data.people||[];

app.innerHTML=`
<div class="wrap page">

<div class="eyebrow">SEARCH RESULTS</div>

<h1>
Results for "${escapeHtml(q)}"
</h1>

<section class="section">

<h2>Movies</h2>

<div class="resultList">

${moviesFound.length?
moviesFound.slice(0,15).map(m=>`
<div class="result tmdbMovie" data-id="${m.id}">
<div>
<b>${escapeHtml(m.title||"Untitled")}</b>
<div class="muted">
${m.release_date?
escapeHtml(m.release_date.substring(0,4)):""}
</div>
</div>
<div>→</div>
</div>
`).join("")
:
`<div class="empty">No movies found.</div>`
}

</div>

</section>

<section class="section">

<h2>Stars</h2>

<div class="resultList">

${peopleFound.length?
peopleFound.slice(0,15).map(p=>`
<div class="result" data-person-id="${p.id}">
<div>
<b>${escapeHtml(p.name||"Unknown")}</b>
<div class="muted">
${escapeHtml(p.known_for_department||"Actor")}
</div>
</div>
<div>→</div>
</div>
`).join("")
:
`<div class="empty">No stars found.</div>`
}

</div>

</section>

</div>`;

}catch(err){

app.innerHTML=`
<div class="wrap page">

<div class="empty">

<h2>Search failed.</h2>

<p class="muted">
${escapeHtml(err.message)}
</p>

</div>

</div>`;
}
}

document.addEventListener("click",function(e){

const movieEl=e.target.closest("[data-movie]");

if(movieEl){
movie(movieEl.dataset.movie);
return;
}

const personName=e.target.closest("[data-person-name]");

if(personName){
personByName(personName.dataset.personName);
return;
}

const tmdbMovie=e.target.closest("[data-id]");

if(tmdbMovie){
movieFromTmdb(tmdbMovie.dataset.id);
return;
}

const personId=e.target.closest("[data-person-id]");

if(personId){
loadPerson(personId.dataset.personId);
return;
}

const page=e.target.closest("[data-page]");

if(page){

const p=page.dataset.page;

if(p==="home")home();
if(p==="discover")discover();
if(p==="stars")stars();
if(p==="stories")stories();
if(p==="sixdegrees")sixdegrees();

return;
}

});

document.getElementById("logo").onclick=home;

document.getElementById("searchForm").addEventListener(
"submit",
function(e){
e.preventDefault();
search();
}
);

home();

</script>

</body>
</html>
