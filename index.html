<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reelwise — Know the Movie. Know the Story.</title>

<style>
:root{
  --bg:#090b0f;
  --panel:#11151c;
  --line:#252c38;
  --text:#f5f7fa;
  --muted:#9ca6b5;
  --accent:#ff5a36;
  --gold:#e4b34d
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

button,input{font:inherit}
button{cursor:pointer}

.wrap{
  max-width:1120px;
  margin:auto;
  padding:0 20px
}

header{
  position:sticky;
  top:0;
  z-index:5;
  background:rgba(9,11,15,.96);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line)
}

.nav{
  min-height:68px;
  display:flex;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
  padding:10px 20px
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:-1px;
  cursor:pointer
}

.logo span{color:var(--accent)}

nav{
  display:flex;
  gap:5px;
  color:#cbd1da
}

nav button{
  background:none;
  border:0;
  color:inherit;
  padding:8px 10px
}

nav button:hover{
  color:white
}

.searchbox{
  margin-left:auto;
  display:flex;
  gap:8px
}

.searchbox input{
  width:250px;
  background:#151a22;
  border:1px solid #303846;
  color:white;
  border-radius:9px;
  padding:10px 12px;
  outline:none
}

.searchbox input:focus{
  border-color:var(--accent)
}

.searchbox button,
.cta{
  background:var(--accent);
  border:0;
  color:white;
  border-radius:9px;
  padding:10px 15px;
  font-weight:800
}

.page{
  padding:45px 0 70px
}

.hero{
  padding:55px 0 40px;
  display:grid;
  grid-template-columns:1.4fr .8fr;
  gap:35px;
  align-items:center
}

.eyebrow{
  color:var(--gold);
  font-weight:900;
  letter-spacing:1.5px;
  font-size:12px
}

.hero h1{
  font-size:clamp(44px,7vw,76px);
  line-height:.98;
  letter-spacing:-3px;
  margin:12px 0 18px
}

.hero p{
  font-size:19px;
  color:var(--muted);
  max-width:650px
}

.heroCard{
  background:linear-gradient(145deg,#1d2634,#0f1319);
  border:1px solid var(--line);
  border-radius:18px;
  padding:28px;
  min-height:280px;
  display:flex;
  flex-direction:column;
  justify-content:end
}

.heroCard b{font-size:28px}

.section{
  padding:28px 0
}

.sectionhead{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-bottom:18px
}

.section h2{
  margin:0;
  font-size:28px
}

.muted{
  color:var(--muted)
}

.grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:14px
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  transition:.18s
}

.card:hover{
  transform:translateY(-3px);
  border-color:#4a5568
}

.poster{
  aspect-ratio:2/3;
  background:linear-gradient(145deg,#36465b,#141820);
  display:flex;
  align-items:end;
  padding:15px;
  font-size:20px;
  font-weight:900
}

.poster img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block
}

.info{
  padding:13px
}

.info b{
  display:block
}

.info small{
  color:var(--muted)
}

.feature{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:15px;
  padding:24px;
  margin:12px 0
}

.feature h3{
  font-size:24px;
  margin:6px 0
}

.feature p{
  color:var(--muted);
  max-width:780px
}

.detail{
  display:grid;
  grid-template-columns:280px 1fr;
  gap:30px
}

.detailposter{
  aspect-ratio:2/3;
  border-radius:15px;
  background:linear-gradient(145deg,#39495f,#10141a);
  overflow:hidden
}

.detailposter img{
  width:100%;
  height:100%;
  object-fit:cover
}

.personHero{
  display:grid;
  grid-template-columns:280px 1fr;
  gap:30px;
  align-items:start
}

.personPhoto{
  aspect-ratio:2/3;
  border-radius:15px;
  background:linear-gradient(145deg,#39495f,#10141a);
  background-size:cover;
  background-position:center;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:48px;
  font-weight:900
}

.personIntro h1{
  font-size:clamp(40px,6vw,62px);
  line-height:1;
  margin:0 0 12px
}

.personIntro p{
  color:var(--muted);
  font-size:16px;
  max-width:760px
}

.personMeta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:10px 0 18px
}

.personMeta span{
  background:#151b24;
  border:1px solid #303846;
  border-radius:999px;
  padding:7px 10px;
  color:#cbd1da
}

.facts{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:20px 0
}

.fact{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:10px;
  padding:13px
}

.fact b{
  display:block;
  font-size:18px
}

.fact small{
  color:var(--muted)
}

.cast{
  display:flex;
  flex-wrap:wrap;
  gap:8px
}

.cast button{
  background:#151b24;
  color:white;
  border:1px solid #303846;
  border-radius:8px;
  padding:9px
}

.resultList{
  display:grid;
  gap:10px;
  margin-top:20px
}

.result{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:10px;
  padding:14px;
  display:flex;
  justify-content:space-between;
  cursor:pointer
}

.empty{
  padding:40px;
  text-align:center;
  background:var(--panel);
  border:1px dashed #37404e;
  border-radius:14px
}

.back{
  background:none;
  border:0;
  color:var(--muted);
  padding:0 0 20px
}

.quote{
  font-size:22px;
  font-weight:800;
  padding:14px 0;
  border-bottom:1px solid var(--line)
}

.quote:last-child{
  border-bottom:0
}

.degreeBox{
  max-width:800px;
  margin:25px auto
}

.degreeForm{
  display:grid;
  grid-template-columns:1fr 1fr auto;
  gap:10px;
  margin-bottom:25px
}

.degreeForm input{
  background:#151a22;
  border:1px solid #303846;
  color:white;
  border-radius:9px;
  padding:13px
}

.degreeForm button{
  background:var(--accent);
  border:0;
  color:white;
  border-radius:9px;
  padding:13px 18px;
  font-weight:800
}

.degreeResult{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:15px;
  padding:25px
}

.degreeTitle{
  font-size:26px;
  font-weight:900;
  margin-bottom:20px
}

.connection{
  background:#151a22;
  border:1px solid #303846;
  border-radius:12px;
  padding:18px;
  margin:12px 0
}

.connectionActor{
  font-size:21px;
  font-weight:900
}

.connectionMovie{
  color:var(--gold);
  font-weight:800;
  margin-top:5px
}

.connectionArrow{
  color:var(--muted);
  text-align:center;
  padding:4px
}

.error{
  color:#ff8d76;
  background:#211411;
  border:1px solid #613127;
  border-radius:10px;
  padding:15px
}

.loading{
  color:var(--muted);
  padding:20px 0
}

.footer{
  border-top:1px solid var(--line);
  color:#737d8b;
  padding:28px 0;
  font-size:12px
}

@media(max-width:850px){

  .hero,
  .detail,
  .personHero{
    grid-template-columns:1fr
  }

  .grid{
    grid-template-columns:repeat(2,1fr)
  }

  .searchbox{
    order:2;
    width:100%;
    margin-left:0
  }

  .searchbox input{
    width:100%
  }

  nav{
    order:3;
    width:100%;
    overflow-x:auto
  }

  .facts{
    grid-template-columns:1fr 1fr
  }

  .degreeForm{
    grid-template-columns:1fr
  }
}

@media(max-width:480px){

  .grid{
    grid-template-columns:1fr 1fr
  }

  .hero{
    padding-top:35px
  }

  .hero h1{
    letter-spacing:-2px
  }

  .logo{
    font-size:21px
  }
}
</style>
</head>

<body>

<div class="wrap nav">

<div class="logo" id="logo">
reel<span>wise</span>

id="searchInput"

],

const app=document.getElementById("app");

function escapeHtml(value){
return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function posterHtml(movie){
if(movie.poster_path){
return `<img src="https://image.tmdb.org/t/p/w500${movie.poster_path}" alt="${escapeHtml(movie.title)}">`;
}

return `<span>${escapeHtml(movie.icon || "🎬")} ${escapeHtml(movie.title)}</span>`;
}

function movieCard(movie){
return `
<article class="card" data-movie="${escapeHtml(movie.id)}">
<div class="poster">
${posterHtml(movie)}
</div>
<div class="info">
<b>${escapeHtml(movie.title)}</b>
<small>${escapeHtml(movie.year || "")} · ${escapeHtml(movie.genre || "")}</small>
</div>
</article>
`;
}

app.innerHTML=`
<div class="wrap page">

<h1>Know the movie.<br>Know the story.</h1>

function renderDiscover(){

</div>

</div>

<div class="feature">

<p>

Val Kilmer or thousands of other actors.
</p>
</div>

</section>

</div>
`;

<section class="section">

<div class="sectionhead">
<h2>Stories</h2>
</div>

${movies.map(movie=>`
<div class="feature">
<div class="eyebrow">${escapeHtml(movie.year)}</div>

</div>
`).join("")}

function renderSixDegrees(){

app.innerHTML=`
<div class="wrap page">

<button class="back" data-page="home">← Back to home</button>

<div class="degreeBox">

<div class="eyebrow">THE REELWISE GAME</div>

<h1>Six Degrees</h1>

<p class="muted">
Connect any two actors through the movies they've appeared in.
The connection can be up to six movie steps.
</p>

<form class="degreeForm" id="degreeForm">

<input
id="degreeFrom"
placeholder="First actor"
autocomplete="off">

<input
id="degreeTo"
placeholder="Second actor"
autocomplete="off">

<button type="submit">Connect</button>

</form>

<div id="degreeOutput"></div>

</div>

</div>
`;

document
.getElementById("degreeForm")
.addEventListener("submit",runDegrees);
}

async function runDegrees(event){

event.preventDefault();

const from=document
.getElementById("degreeFrom")
.value
.trim();

const to=document
.getElementById("degreeTo")
.value
.trim();

const output=document.getElementById("degreeOutput");

if(!from || !to){

output.innerHTML=`
<div class="error">
Please enter two actor names.
</div>
`;

return;
}

if(from.toLowerCase()===to.toLowerCase()){

output.innerHTML=`
<div class="error">
Choose two different actors.
</div>
`;

return;
}

output.innerHTML=`
<div class="loading">
Finding the connection…
</div>
`;

try{

const response=await fetch(
`/api/search?type=degrees&from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`
);

const data=await response.json();

if(!response.ok){

throw new Error(
data.error ||
data.message ||
"Could not find the connection."
);

}

if(!data.path || !Array.isArray(data.path) || data.path.length===0){

throw new Error("We couldn't find that connection.");
}

renderDegreeResult(data);

}catch(error){

output.innerHTML=`
<div class="error">
${escapeHtml(error.message || "We couldn't find that connection.")}
</div>
`;
}
}

function renderDegreeResult(data){

const output=document.getElementById("degreeOutput");

const path=Array.isArray(data.path) ? data.path : [];

if(!path.length){

output.innerHTML=`
<div class="error">
We couldn't find that connection.
</div>
`;

return;
}

const firstPerson=
data.from?.name ||
path[0]?.person?.name ||
"Actor";

const lastPerson=
data.to?.name ||
path[path.length-1]?.person?.name ||
"Actor";

let html=`
<div class="degreeResult">

<div class="degreeTitle">
${escapeHtml(firstPerson)}
→
${escapeHtml(lastPerson)}
</div>
`;

let lastActor=null;

for(const step of path){

const person=step?.person;

if(!person || !person.name){
continue;
}

const actorName=person.name;

if(lastActor){

html+=`
<div class="connectionArrow">↓</div>
`;
}

html+=`
<div class="connection">
<div class="connectionActor">
${escapeHtml(actorName)}
</div>
`;

if(step.movie && step.movie.title){

const movieTitle=step.movie.title;
const movieYear=step.movie.year
? ` (${escapeHtml(step.movie.year)})`
: "";

html+=`
<div class="connectionMovie">
🎬 ${escapeHtml(movieTitle)}${movieYear}
</div>
`;
}

html+=`
</div>
`;

lastActor=actorName;
}

html+=`
</div>
`;

output.innerHTML=html;
}

function bindCards(){

document
.querySelectorAll("[data-movie]")
.forEach(card=>{

card.addEventListener("click",()=>{

const id=card.dataset.movie;

const movie=movies.find(item=>item.id===id);

if(movie){
renderMovie(movie);
}

});

});
}

function renderMovie(movie){

app.innerHTML=`
<div class="wrap page">

<button class="back" data-page="home">← Back to home</button>

<div class="detail">

<div class="detailposter">
${posterHtml(movie)}
</div>

<div>

<div class="eyebrow">${escapeHtml(movie.year)}</div>

<h1>${escapeHtml(movie.title)}</h1>

<p class="muted">
${escapeHtml(movie.genre)}
</p>

<div class="feature">
<h3>Behind the Movie</h3>
<p>${escapeHtml(movie.story)}</p>
</div>

<section class="section">

<h2>Cast</h2>

<div class="cast">

${movie.cast.map(actor=>`
<button
class="actorButton"
data-actor="${escapeHtml(actor)}">
${escapeHtml(actor)}
</button>
`).join("")}

</div>

</section>

<section class="section">

<h2>Quotes</h2>

<div class="feature">

${
(quotes[movie.title] || [])
.map(q=>`
<div class="quote">“${escapeHtml(q)}”</div>
`)
.join("")
|| `<div class="muted">Quotes coming soon.</div>`
}

</div>

</section>

</div>

</div>

</div>
`;

document
.querySelectorAll(".actorButton")
.forEach(button=>{

button.addEventListener("click",()=>{

searchPerson(button.dataset.actor);

});

});

}

async function searchTMDB(query){

const response=await fetch(
`/api/search?q=${encodeURIComponent(query)}`
);

if(!response.ok){

throw new Error("Search failed.");

}

return response.json();
}

async function searchPerson(name){

app.innerHTML=`
<div class="wrap page">
<div class="loading">
Loading ${escapeHtml(name)}…
</div>
</div>
`;

try{

const data=await searchTMDB(name);

const people=data.people || data.results || [];

const person=people.find(
item=>item.known_for_department==="Acting"
) || people[0];

if(!person){

throw new Error("Actor not found.");
}

renderPerson(person);

}catch(error){

app.innerHTML=`
<div class="wrap page">

<button class="back" data-page="home">← Back to home</button>

<div class="error">
${escapeHtml(error.message)}
</div>

</div>
`;
}
}

function renderPerson(person){

const photo=person.profile_path
? `https://image.tmdb.org/t/p/w500${person.profile_path}`
: "";

app.innerHTML=`
<div class="wrap page">

<button class="back" data-page="home">← Back to home</button>

<div class="personHero">

<div
class="personPhoto"
style="${photo ? `background-image:url('${photo}')` : ""}">
${photo ? "" : "★"}
</div>

<div class="personIntro">

<div class="eyebrow">REELWISE STAR</div>

<h1>${escapeHtml(person.name)}</h1>

<div class="personMeta">
<span>Actor</span>
${person.known_for_department
? `<span>${escapeHtml(person.known_for_department)}</span>`
: ""}
</div>

<p>
${escapeHtml(
person.biography ||
"Biography information coming soon."
)}
</p>

<div class="facts">

<div class="fact">
<b>${escapeHtml(person.name)}</b>
<small>Star</small>
</div>

<div class="fact">
<b>TMDB</b>
<small>Movie database</small>
</div>

<div class="fact">
<b>Reelwise</b>
<small>Movie stories</small>
</div>

</div>

</div>

</div>

</div>
`;
}

async function performSearch(query){

app.innerHTML=`
<div class="wrap page">
<div class="loading">
Searching for “${escapeHtml(query)}”…
</div>
</div>
`;

try{

const data=await searchTMDB(query);

const results=data.results || [];

if(!results.length){

app.innerHTML=`
<div class="wrap page">

<button class="back" data-page="home">← Back to home</button>

<div class="empty">
No results found for “${escapeHtml(query)}”.
</div>

</div>
`;

return;
}

const people=results.filter(
item=>item.media_type==="person"
);

const films=results.filter(
item=>item.media_type==="movie"
);

app.innerHTML=`
<div class="wrap page">

<button class="back" data-page="home">← Back to home</button>

<h1>Search Results</h1>

${
people.length
? `
<section class="section">

<h2>Stars</h2>

<div class="resultList">

${people.slice(0,10).map(person=>`

<div
class="result"
data-person-id="${escapeHtml(person.id)}">

<div>
<b>${escapeHtml(person.name)}</b>
<div class="muted">Actor</div>
</div>

<div>→</div>

</div>

`).join("")}

</div>

</section>
`
:""
}

${
films.length
? `
<section class="section">

<h2>Movies</h2>

<div class="grid">

${films.slice(0,10).map(movieCard).join("")}

</div>

</section>
`
:""
}

</div>
`;

bindCards();

document
.querySelectorAll("[data-person-id]")
.forEach(item=>{

item.addEventListener("click",()=>{

const person=people.find(
p=>String(p.id)===String(item.dataset.personId)
);

if(person){
renderPerson(person);
}

});

});

}catch(error){

app.innerHTML=`
<div class="wrap page">

<button class="back" data-page="home">← Back to home</button>

<div class="error">
Search failed. Please try again.
</div>

</div>
`;
}
}

document
.getElementById("searchForm")
.addEventListener("submit",event=>{

event.preventDefault();

const query=document
.getElementById("searchInput")
.value
.trim();

if(query){
performSearch(query);
}

});

document
.querySelectorAll("[data-page]")
.forEach(button=>{

button.addEventListener("click",()=>{

const page=button.dataset.page;

if(page==="home") renderHome();
if(page==="discover") renderDiscover();
if(page==="stars") renderStars();
if(page==="stories") renderStories();
if(page==="sixdegrees") renderSixDegrees();

});

});

document
.getElementById("logo")
.addEventListener("click",renderHome);

renderHome();

</script>

</body>
</html>
